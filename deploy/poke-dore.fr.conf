# Nginx — poke-dore.fr (site statique)
# Installé automatiquement par deploy/vps-setup.sh.
# À la main : copier dans /etc/nginx/sites-available/, activer, puis :
#   certbot --nginx -d poke-dore.fr -d www.poke-dore.fr --redirect
#   (certbot ajoute les blocs HTTPS et la redirection http → https)

# www → sans www (une seule version canonique, celle des balises canonical)
server {
    listen 80;
    listen [::]:80;
    server_name www.poke-dore.fr;
    return 301 https://poke-dore.fr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name poke-dore.fr;

    root /var/www/poke-dore.fr;
    index index.html;
    error_page 404 /404.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Dossiers techniques jamais servis
    location ~ ^/(deploy|\.backup|\.playwright-mcp)/ { return 404; }
    location ~ /\.(git|gitignore|DS_Store) { return 404; }
    location = /CLAUDE.md { return 404; }

    # Cache long pour les ressources immuables
    location ~* \.(css|js)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location ~* \.(woff2|jpg|jpeg|png|webp|mp4|svg|ico)$ { expires 365d; add_header Cache-Control "public, immutable"; }
    location ~* \.html$ { expires 10m; add_header Cache-Control "public, must-revalidate"; }

    # En-têtes de sécurité
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
